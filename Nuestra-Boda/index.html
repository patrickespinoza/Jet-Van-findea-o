
<!doctype html>
<html lang="es" translate="no">

      name="viewport"

    />

    <!-- Idioma y traducción -->
    <meta name="google" content="notranslate" />

    <meta property="og:type" content="website" />

      property="og:image"
      content="https://TU-DOMINIO.vercel.app/LOGO.jpg"
    />

    <meta
      property="og:url"
      content="https://TU-DOMINIO.vercel.app/"
    />

    <meta property="og:locale" content="es_MX" />
    <meta property="og:site_name" content="Jet Van" />

    <!-- Twitter / X -->

      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Jet Van | Fiesta de Fin de Año 2026"
    />

      name="twitter:description"
